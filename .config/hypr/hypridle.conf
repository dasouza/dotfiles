general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Timeouts are per machine (dim, lock, screen off, suspend). install.sh writes this file from the
# desktop or laptop defaults; see "Per-machine settings" in the repo README.
source = ./hypridle.local.conf
