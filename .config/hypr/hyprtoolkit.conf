# Theme for hyprtoolkit apps (hyprlauncher, hyprland-dialog, ...)
# Warm amber palette, matches hypr borders and waybar (tokens/colors.css)

# Slightly translucent so Hyprland's blur frosts the wallpaper behind
background = rgba(17130de6)
base = rgba(231f18e6)
alternate_base = rgba(2e2922ff)
text = rgba(ebe1d4ff)
bright_text = rgba(ffffffff)
accent = rgba(e0b070ff)
accent_secondary = rgba(8c5a2eff)

font_family = JetBrainsMono Nerd Font
font_size = 14
rounding_large = 16
rounding_small = 10
